<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Anh Em Quest</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
:root{--bg:#120e26;--bg2:#1c1540;--panel:#3a2b7a;--cam:#ff8a2b;--camd:#a34d00;--pink:#ff6fa3;--mint:#3ddc97;--red:#ff3b4e;--cream:#fff1d6;--gold:#ffd25a;--blue:#5cc8ff;--ink:#0b0818}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--cream);font-family:'VT323',ui-monospace,Menlo,Consolas,monospace;font-size:22px;line-height:1.15;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
#game{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding:8px 14px 10px;gap:6px;background:var(--bg);overflow:hidden}
#hud{display:flex;align-items:center;gap:10px;min-height:28px}
#lvl{color:var(--gold);font-size:24px;white-space:nowrap}
#pips{flex:1;display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.pip{width:10px;height:9px;background:#2c2260;clip-path:polygon(0 25%,25% 0,50% 25%,75% 0,100% 25%,100% 55%,50% 100%,0 55%)}
.pip.on{background:var(--pink)}
.pip.now{background:var(--cam);animation:blink .6s steps(2) infinite}
.mini{background:var(--panel);border:0;padding:3px 8px;font-size:18px;box-shadow:0 3px 0 var(--ink)}
#ttl{font-size:30px;color:var(--cam);text-shadow:2px 2px 0 var(--ink);min-height:30px;letter-spacing:1px}
#sub{font-size:20px;color:#cfc3ff;min-height:22px;margin-top:-4px}
#play{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0d0a20;border:4px solid var(--panel);box-shadow:0 0 0 4px var(--ink);overflow:hidden}
.stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
canvas.cv{image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;display:block}
#foot{display:flex;align-items:center;gap:10px;min-height:38px}
#msg{flex:1;font-size:20px;color:var(--gold);line-height:1}
.btn{background:var(--cam);color:var(--ink);border:0;padding:8px 16px;font-size:24px;box-shadow:0 4px 0 var(--camd);position:relative}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--camd)}
.btn.sm{font-size:20px;padding:5px 12px}
.btn.pink{background:var(--pink);box-shadow:0 4px 0 #a03060}
.btn.mint{background:var(--mint);box-shadow:0 4px 0 #1b7a52}
.btn.big{font-size:32px;padding:10px 22px}
.btn[disabled]{opacity:.5}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:30;image-rendering:pixelated}
#flash{position:absolute;inset:0;pointer-events:none;z-index:40;opacity:0}
#flash.go{animation:fl .5s ease-out}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}
@keyframes blink{50%{opacity:.25}}
@keyframes shk{0%,100%{transform:translate(0,0)}15%{transform:translate(-6px,3px)}30%{transform:translate(5px,-4px)}45%{transform:translate(-4px,-3px)}60%{transform:translate(4px,4px)}75%{transform:translate(-2px,2px)}}
#game.shake #play,#game.shake #hud{animation:shk .45s linear}
@keyframes gl{0%{transform:translate(0);filter:none}10%{transform:translate(-8px,2px);filter:hue-rotate(90deg) saturate(3)}20%{transform:translate(6px,-3px);filter:invert(1)}30%{transform:translate(-3px,5px);filter:hue-rotate(200deg)}40%{transform:translate(9px,0);filter:none}55%{transform:translate(-6px,-2px);filter:hue-rotate(300deg) contrast(2)}70%{transform:translate(2px,4px);filter:invert(.8)}85%{transform:translate(-4px,0);filter:hue-rotate(40deg)}100%{transform:translate(0);filter:none}}
#game.glitch #play{animation:gl .5s steps(2) infinite}
#dlg{position:absolute;left:0;right:0;bottom:0;top:0;z-index:20;display:none;align-items:flex-end;padding:0 10px 12px;background:rgba(6,4,18,.55)}
#dlg.on{display:flex}
#dlg .box{width:100%;background:#1a1240;border:4px solid var(--cream);box-shadow:0 0 0 4px var(--ink);padding:10px 12px 12px 78px;position:relative;min-height:112px}
#por{position:absolute;left:-4px;top:-26px;width:72px;height:72px;image-rendering:pixelated;background:var(--bg2);border:4px solid var(--cream);animation:bob .5s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
#who{color:var(--cam);font-size:22px;margin-bottom:2px}
#dtx{font-size:24px;line-height:1.12;min-height:54px}
#nx{position:absolute;right:10px;bottom:4px;color:var(--gold);animation:blink .7s steps(2) infinite;visibility:hidden}
#card{position:absolute;inset:0;z-index:25;display:none;align-items:center;justify-content:center;background:rgba(6,4,18,.8);padding:20px}
#card.on{display:flex}
.polar{width:100%;max-width:340px;background:var(--cream);color:var(--ink);padding:14px 14px 16px;box-shadow:0 0 0 4px var(--ink),0 8px 0 4px #00000066;text-align:center;animation:pop .35s steps(4)}
.polar canvas{width:100%;image-rendering:pixelated;background:#160f38;display:block;margin-bottom:8px}
.polar h3{margin:0;font-size:30px;line-height:1}
.polar .k{color:#a03060;font-size:20px}
.polar p{margin:6px 0 12px;font-size:23px;line-height:1.1}
@keyframes pop{0%{transform:scale(.3) rotate(-8deg)}100%{transform:scale(1) rotate(0)}}
.ban{position:absolute;inset:0;z-index:26;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:20px}
.ban .n{color:var(--gold);font-size:34px;letter-spacing:4px;animation:sl .5s steps(5)}
.ban .t{color:var(--cam);font-size:48px;line-height:1;text-shadow:3px 3px 0 var(--panel);animation:sl .6s steps(6)}
@keyframes sl{0%{transform:translateX(-120%)}100%{transform:none}}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:100%;padding:6px}
.choice{background:var(--panel);border:3px solid var(--cream);padding:8px 10px;font-size:23px;text-align:left;box-shadow:0 4px 0 var(--ink);flex:1 1 44%}
.choice:active{transform:translateY(3px);box-shadow:none}
.choice.bad{background:#5a1f3a;animation:shk .4s linear}
.choice.good{background:#1b6a4a}
.col{display:flex;flex-direction:column;gap:8px;width:100%;padding:8px}
.pad{width:100%;display:grid;gap:8px;padding:8px}

#game::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,#2b1d66 0%,transparent 60%);pointer-events:none;z-index:0}
#hud,#ttl,#sub,#foot{position:relative;z-index:1}
#play::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px);z-index:5}
</style>

<div id="game">
  <div id="hud"><span id="lvl">MÀN 0/18</span><div id="pips"></div><button id="mute" class="mini" aria-label="Bật tắt âm thanh">ÂM: BẬT</button></div>
  <div id="ttl"></div><div id="sub"></div>
  <div id="play"></div>
  <div id="foot"><button id="hintBtn" class="btn sm">GỢI Ý</button><div id="msg"></div></div>
  <canvas id="fx"></canvas>
  <div id="flash"></div>
  <div id="card"></div>
  <div id="dlg"><div class="box"><canvas id="por" width="24" height="24"></canvas><div id="who"></div><div id="dtx"></div><div id="nx">▼</div></div></div>
</div>

<script>
'use strict';
/* ====== CẤU HÌNH (anh sửa ở đây) ====== */
const CFG={
  code:'HB3YR',
  date:'25.10.2026',
  letter:[
    'Ba năm rồi.',
    'Em từng viết: "hi vọng bất kể tương lai như thế nào, em cũng có anh đồng hành bên cạnh."',
    'Điều ước đó, anh xin nhận. Và anh xin ước lại y như vậy.',
    'Tối kỷ niệm, mình ăn tối nhé. Nhắn mã cho anh, anh sẽ nói chỗ hẹn.'
  ]
};
const TOTAL=18;
const $=s=>document.querySelector(s);
const game=$('#game'),play=$('#play'),msgEl=$('#msg'),fx=$('#fx'),fxg=fx.getContext('2d');
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pick=a=>a[ri(0,a.length-1)];
const C={cam:'#ff8a2b',pink:'#ff6fa3',mint:'#3ddc97',red:'#ff3b4e',cream:'#fff1d6',gold:'#ffd25a',blue:'#5cc8ff',ink:'#0b0818',panel:'#3a2b7a',navy:'#120e26',skin:'#f7c9a0',hair:'#2a1a2e',brown:'#7a4a2a'};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};

/* ====== ÂM THANH (chiptune tự tổng hợp) ====== */
const AU={ctx:null,on:true,pending:null};
function auInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}
  try{
    const X=window.AudioContext||window.webkitAudioContext;AU.ctx=new X();
    AU.master=AU.ctx.createGain();AU.master.gain.value=AU.on?.9:0;AU.master.connect(AU.ctx.destination);
    AU.mg=AU.ctx.createGain();AU.mg.gain.value=.5;AU.mg.connect(AU.master);
    AU.sg=AU.ctx.createGain();AU.sg.gain.value=.9;AU.sg.connect(AU.master);
    const len=AU.ctx.sampleRate;const b=AU.ctx.createBuffer(1,len,AU.ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.nb=b;
    if(AU.pending){Music.start(AU.pending);}
  }catch(e){AU.ctx=null}
}
function silentWav(){const n=4000,b=new Uint8Array(44+n*2),v=new DataView(b.buffer),w=(o,s)=>{for(let i=0;i<s.length;i++)b[o+i]=s.charCodeAt(i)};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,16000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return 'data:audio/wav;base64,'+btoa(s)}
function refreshMute(){const m=document.getElementById('mute');if(!m)return;const run=AU.ctx&&AU.ctx.state==='running';m.textContent=!AU.on?'ÂM: TẮT':run?'ÂM: BẬT':'ÂM: CHẠM'}
function auMark(){const c=AU.ctx;if(!c)return;try{const s=c.createBufferSource();s.buffer=c.createBuffer(1,1,22050);s.connect(c.destination);s.start(0)}catch(e){}refreshMute()}
/* mở khoá âm thanh trên điện thoại: iOS/Android chỉ cho phát sau lần chạm (touchend/click), iOS còn tắt tiếng khi gạt công tắc im lặng */
function auUnlock(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  auInit();const c=AU.ctx;
  if(c&&c.state!=='running'){try{c.resume().then(auMark).catch(()=>{})}catch(e){}}
  if(!AU.el){try{const a=new Audio(silentWav());a.loop=true;a.setAttribute('playsinline','');const pr=a.play();if(pr&&pr.catch)pr.catch(()=>{AU.el=null});AU.el=a}catch(e){}}
  else if(AU.el.paused){try{AU.el.play().catch(()=>{})}catch(e){}}
  if(c&&c.state==='running')auMark();
}
const NS={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function hz(n){const m=/^([A-G])([#b]?)(\d)$/.exec(n);if(!m)return 0;let s=NS[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0);return 440*Math.pow(2,(s+(+m[3]-4)*12-9)/12)}
function tone(f,d,o={}){
  if(!AU.ctx||!f)return;const c=AU.ctx,t=o.at||c.currentTime;
  const os=c.createOscillator(),g=c.createGain();os.type=o.type||'square';os.frequency.setValueAtTime(f,t);
  if(o.slide)os.frequency.exponentialRampToValueAtTime(Math.max(30,f+o.slide),t+d);
  const v=o.v==null?.1:o.v;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  os.connect(g);g.connect(o.dest||AU.sg);os.start(t);os.stop(t+d+.03);
}
function noise(d,v=.15,at){
  if(!AU.ctx)return;const c=AU.ctx,t=at||c.currentTime,s=c.createBufferSource(),g=c.createGain();
  s.buffer=AU.nb;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(g);g.connect(AU.sg);s.start(t);s.stop(t+d+.02);
}
function sfx(n){
  if(!AU.ctx)return;const t=AU.ctx.currentTime;
  switch(n){
    case'tap':tone(660,.05,{v:.07});break;
    case'pick':tone(880,.06,{v:.08});tone(1320,.08,{v:.08,at:t+.05});break;
    case'ok':[523,659,784,1047].forEach((f,i)=>tone(f,.13,{v:.1,at:t+i*.08}));break;
    case'bad':tone(220,.18,{type:'sawtooth',v:.09,slide:-120});tone(160,.22,{type:'sawtooth',v:.09,at:t+.12,slide:-90});break;
    case'win':[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.16,{v:.11,at:t+i*.1}));break;
    case'jump':tone(300,.14,{v:.08,slide:400});break;
    case'hit':noise(.15,.2);tone(120,.2,{type:'sawtooth',v:.1,slide:-60});break;
    case'shoot':tone(900,.07,{v:.04,slide:-500});break;
    case'boom':noise(.7,.35);tone(90,.6,{type:'sawtooth',v:.15,slide:-60});break;
    case'glitch':for(let i=0;i<6;i++){noise(.06,.18,t+i*.07);tone(rnd(100,1800),.05,{type:'sawtooth',v:.08,at:t+i*.07})}break;
    case'blipV':tone(130,.04,{type:'sawtooth',v:.05});break;
    case'blipE':tone(760,.035,{v:.04});break;
    case'blipA':tone(520,.035,{v:.04});break;
    case'blipS':tone(300,.03,{type:'triangle',v:.06});break;
    case'bell':tone(1568,.5,{type:'triangle',v:.12});tone(2093,.5,{type:'triangle',v:.06});break;
    case'open':[392,523,659,784,1047,1319].forEach((f,i)=>tone(f,.22,{type:'triangle',v:.12,at:t+i*.09}));break;
    case'lock':tone(200,.05,{v:.1});tone(150,.08,{v:.1,at:t+.05});break;
  }
}
const TR={
  main:{bpm:132,lead:'E5 G5 C6 G5 E5 G5 C6 -  D5 F5 A5 F5 D5 F5 B5 -  E5 G5 C6 E6 D6 C6 G5 -  F5 E5 D5 E5 C5 - - -',bass:'C3 - C3 - G3 - G3 -  D3 - D3 - G3 - G3 -  C3 - C3 - E3 - G3 -  F3 - G3 - C3 - - -'},
  sneak:{bpm:104,lead:'A4 - C5 - E5 - C5 -  A4 - B4 - D5 - B4 -  G4 - B4 - D5 - B4 -  E4 - G#4 - B4 - - -',bass:'A2 - - - E3 - - -  G2 - - - D3 - - -  F2 - - - C3 - - -  E2 - - - E3 - - -'},
  boss:{bpm:168,lead:'D5 F5 A5 F5 D5 F5 A5 C6  Bb4 D5 F5 D5 Bb4 D5 F5 A5  G4 Bb4 D5 Bb4 G4 Bb4 D5 F5  A4 C#5 E5 C#5 A4 C#5 E5 -',bass:'D3 D3 - D3 D3 - D3 -  Bb2 Bb2 - Bb2 Bb2 - Bb2 -  G2 G2 - G2 G2 - G2 -  A2 A2 - A2 A2 - A2 -'},
  love:{bpm:84,lead:'E5 - G5 - C6 - B5 -  A5 - G5 - E5 - - -  F5 - A5 - C6 - B5 -  G5 - E5 - D5 - C5 -',bass:'C3 - - - G3 - - -  A2 - - - E3 - - -  F2 - - - C3 - - -  G2 - - - C3 - - -'}
};
const Music={name:null,id:null,
  start(n){
    if(this.name===n&&this.id)return;this.stop();this.name=n;
    if(!AU.ctx){AU.pending=n;return}
    const tr=TR[n];if(!tr)return;const L=tr.lead.split(/\s+/),B=tr.bass.split(/\s+/),sd=60/tr.bpm/2;
    let step=0,next=AU.ctx.currentTime+.08;const lt=n==='love'?'triangle':'square';
    this.id=setInterval(()=>{
      while(next<AU.ctx.currentTime+.3){
        const i=step%L.length,l=L[i],b=B[i];
        if(l&&l!=='-')tone(hz(l),sd*1.6,{type:lt,v:n==='boss'?.05:.045,at:next,dest:AU.mg});
        if(b&&b!=='-')tone(hz(b),sd*1.9,{type:'triangle',v:.12,at:next,dest:AU.mg});
        if(n==='boss'&&i%2===0)noise(.04,.05,next);
        next+=sd;step++;
      }
    },60);
  },
  stop(){if(this.id)clearInterval(this.id);this.id=null;this.name=null;AU.pending=null},
  vol(v){if(AU.mg)AU.mg.gain.value=v}
};
$('#mute').onclick=()=>{AU.on=!AU.on;if(AU.master)AU.master.gain.value=AU.on?.9:0;auUnlock();refreshMute()};
document.addEventListener('visibilitychange',()=>{if(!AU.ctx)return;if(document.hidden)AU.ctx.suspend();else AU.ctx.resume()});

/* ====== VẼ PIXEL (chibi dễ thương, có viền) ====== */
const OL='#241638';
function bmp(g,rows,pal,x,y,u){rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const c=pal[r[i]];if(c){g.fillStyle=c;g.fillRect(Math.round(x+i*u),Math.round(y+j*u),Math.ceil(u),Math.ceil(u))}}})}
function bmpO(g,rows,pal,x,y,u,ol=OL){
  const h=rows.length,w=Math.max(...rows.map(r=>r.length));
  const sol=(i,j)=>j>=0&&j<h&&i>=0&&i<rows[j].length&&pal[rows[j][i]];
  g.fillStyle=ol;
  for(let j=-1;j<=h;j++)for(let i=-1;i<=w;i++){if(sol(i,j))continue;if(sol(i+1,j)||sol(i-1,j)||sol(i,j+1)||sol(i,j-1))g.fillRect(Math.round(x+i*u),Math.round(y+j*u),Math.ceil(u),Math.ceil(u))}
  bmp(g,rows,pal,x,y,u);
}
const R=(g,u,ox,oy)=>(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(ox+x*u),Math.round(oy+y*u),Math.ceil(w*u),Math.ceil(h*u))};
/* vẽ danh sách hình chữ nhật có viền */
function outl(g,x,y,u,A,ol=OL){
  const p=R(g,u,x,y);
  A.forEach(a=>p(a[0]-1,a[1]-1,a[2]+2,a[3]+2,ol));
  A.forEach(a=>p(a[0],a[1],a[2],a[3],a[4]));
}
/* nhân vật chibi: khung 14x19 */
function chibi(g,x,y,u,o){
  const f=o.f|0,sk=o.skin||C.skin,hr=o.hair||C.hair,A=[],a=(X,Y,W,H,c)=>A.push([X,Y,W,H,c]);
  if(o.long){a(2,2,10,11,hr);a(2,12,2,2,hr);a(10,12,2,2,hr)}else a(2,2,10,4,hr);
  a(4,11,6,4,o.top);a(3,11,1,3,o.top);a(10,11,1,3,o.top);a(3,14,1,1,sk);a(10,14,1,1,sk);
  if(o.wave&&f){a(11,8,1,4,o.top);a(11,7,1,1,sk)}
  if(o.dress){a(3,14,8,3,o.bot);a(3,16,8,1,'#fff');a(5,17,1,1,sk);a(8,17,1,1,sk);a(4-(f?1:0),18,3,1,'#c94a7d');a(8+(f?1:0),18,3,1,'#c94a7d')}
  else{a(4,15,6,1,o.bot);a(4,16,2,2,o.bot);a(8,16,2,2,o.bot);a(4-(f?1:0),18,3,1,'#3a3350');a(8+(f?1:0),18,3,1,'#3a3350')}
  a(3,4,8,7,sk);a(3,2,8,3,hr);
  if(o.long){a(3,5,2,3,hr);a(9,5,2,3,hr)}else{a(3,5,1,1,hr);a(10,5,1,1,hr);a(4,5,2,1,hr);a(8,5,2,1,hr)}
  if(o.bow){a(9,1,4,3,C.pink)}
  outl(g,x,y,u,A);

    }
    hearts.forEach(h=>{if(!h.got)heart(g,h.x-cam-10,h.y-9+Math.sin(t*4+h.ph)*3,3,C.pink)});
    ens.forEach(e=>{if(e.dead){g.globalAlpha=Math.max(0,e.dead*2.5);g.drawImage(bean,e.x-cam-1,e.y+16,28,10);g.globalAlpha=1}else g.drawImage(bean,e.x-cam-1,e.y-2+Math.abs(Math.sin(t*6+e.x))*-2,28,28)});
    cfg.goalDraw(g,cfg.goal*T-cam,t,fin);
    if(inv<=0||((t*16)|0)%2){fr=Math.abs(p.vx)>1&&p.on?((t*10)|0)%2:0;EM(g,p.x-cam-4,p.y-2,2,fr,0)}
    text(g,'TIM  '+got+' / '+needH,12,16,24,C.gold);bar(g,12,30,120,8,got/Math.max(1,needH),C.pink);
  });
}

/* ====== ENGINE ĐẶT BOM KIỂU BOMBERMAN / BOOM ====== */
function boom(L,cfg){
  const {c,g}=L.canvas(360,400),W=9,H=9,T=40,OY=40,MB=2,RG=2;
  let map,bombs,flames,en,boss,goal,pl,lives=3,inv=0,end=0,reveal=0,held=null,bt=0;
  const bean=beanCanvas(),BMAX=cfg.boss?6:0;
  const D={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};
  function build(){
    map=[];bombs=[];flames=[];en=[];boss=null;goal=null;
    for(let y=0;y<H;y++){map.push([]);for(let x=0;x<W;x++){
      let v=0;if(x%2&&y%2)v=1;else if(x+y>2&&!(x>=W-2&&y>=H-2&&cfg.boss)&&Math.random()<cfg.dens)v=2;map[y].push(v)}}
    if(cfg.hid){map[H-1][W-1]=2;goal={x:W-1,y:H-1,vis:0}}
    for(let i=0;i<(cfg.en||0);i++){let x,y,k=0;do{x=ri(0,W-1);y=ri(0,H-1);k++}while((map[y][x]||x+y<7||en.some(e=>e.x===x&&e.y===y))&&k<200);
      en.push({x,y,px:x,py:y,cd:rnd(.2,.6),d:'l'})}
    if(cfg.boss)boss={x:W-1,y:H-1,px:W-1,py:H-1,hp:bossHp,inv:0,cd:1,bb:3};
    pl={x:0,y:0,px:0,py:0,cd:0};inv=1;
  }
  let bossHp=BMAX;
  const has=(x,y)=>bombs.some(b=>b.x===x&&b.y===y);
  const free=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&map[y][x]===0&&!has(x,y);
  function tryMove(o,d){const [dx,dy]=D[d],nx=o.x+dx,ny=o.y+dy;if(free(nx,ny)){o.x=nx;o.y=ny;return true}return false}
  function explode(b){
    bombs=bombs.filter(q=>q!==b);const cells=[[b.x,b.y]];sfx('boom');
    Object.values(D).forEach(([dx,dy])=>{for(let k=1;k<=RG;k++){const x=b.x+dx*k,y=b.y+dy*k;if(x<0||y<0||x>=W||y>=H||map[y][x]===1)break;cells.push([x,y]);
      if(map[y][x]===2){map[y][x]=0;cburst(c,x*T+20,OY+y*T+20,10,[C.cam,'#f2b06e','#fff']);if(goal&&x===goal.x&&y===goal.y)goal.vis=1;break}}});
    cells.forEach(([x,y])=>{flames.push({x,y,t:.5,own:b.own});bombs.filter(q=>q.x===x&&q.y===y).forEach(q=>q.t=Math.min(q.t,.05))});
  }
  const inFl=(x,y,o)=>flames.some(f=>f.x===x&&f.y===y&&(!o||f.own===o));
  function hurt(){
    if(inv>0||end)return;lives--;inv=1.6;sfx('hit');shake();
    if(lives<=0){lives=3;if(cfg.boss)bossHp=Math.min(BMAX,bossHp+2);msg(cfg.boss?'Bóng Ma: Nhớ dai lắm nha! (Bóng Ma hồi thêm chút máu)':'Thử lại nào!',3500);build()}
  }
  const bomb=()=>{if(L.done||end)return;if(bombs.filter(b=>b.own==='p').length>=MB||has(pl.x,pl.y))return;sfx('lock');bombs.push({x:pl.x,y:pl.y,t:2,own:'p'})};
  build();
  L.dbg={st:()=>({map,pl,goal,en,boss,flames,bombs,lives,end})};
  /* điều khiển */
  const wrap=L.dom('','');wrap.style.cssText='display:flex;align-items:center;justify-content:space-between;width:100%;max-width:360px;padding:0 10px;touch-action:none';
  const dp=document.createElement('div');dp.className='dpad';
  [['▲','u',2,1],['◀','l',1,2],['▼','d',2,2],['▶','r',3,2]].forEach(a=>{const b=document.createElement('button');b.className='btn';b.textContent=a[0];b.style.cssText='grid-column:'+a[2]+';grid-row:'+a[3]+';touch-action:none;user-select:none;-webkit-user-select:none';
    b.addEventListener('pointerdown',e=>{e.preventDefault();held=a[1]});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{if(held===a[1])held=null}));dp.appendChild(b)});
  const bb=document.createElement('button');bb.className='btn big pink';bb.textContent='BOM!';bb.style.cssText='min-width:96px;height:78px;touch-action:none;user-select:none';bb.addEventListener('pointerdown',e=>{e.preventDefault();bomb()});
  wrap.append(dp,bb);
  L.on(document,'keydown',e=>{const m={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'}[e.key];if(m){held=m;e.preventDefault()}else if(e.key===' '){e.preventDefault();bomb()}});
  L.on(document,'keyup',e=>{const m={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'}[e.key];if(m&&held===m)held=null});
  async function defeat(){
    end=1;Music.stop();bombs=[];flames=[];sfx('boom');shake();flash('#fff');
    await sleep(1500);end=2;sfx('glitch');flash('#3ddc97');shake();
    await sleep(1200);end=3;reveal=1;sfx('open');
    await story(cfg.defeat.map((s,i)=>({w:s[0],t:s[1],fn:s[2]==='rev'?()=>{reveal=2}:s[2]==='love'?()=>Music.start('love'):null})));
    L.win();
  }
  L.defeat=()=>{if(!end)defeat()};
  L.loop((dt,t)=>{
    if(!L.done&&end===0){
      inv-=dt;pl.cd-=dt;
      if(held&&pl.cd<=0){if(tryMove(pl,held))pl.cd=.15;else pl.cd=.05}
      bombs.slice().forEach(b=>{b.t-=dt;if(b.t<=0&&bombs.includes(b))explode(b)});
      flames=flames.filter(f=>(f.t-=dt)>0);
      en.forEach(e=>{e.cd-=dt;if(e.cd<=0){e.cd=rnd(.45,.8);const ds=Object.keys(D);if(Math.random()<.65&&free(e.x+D[e.d][0],e.y+D[e.d][1])){tryMove(e,e.d)}else{const o=ds.filter(d=>free(e.x+D[d][0],e.y+D[d][1]));if(o.length){e.d=pick(o);tryMove(e,e.d)}}}});
      en=en.filter(e=>{if(inFl(e.x,e.y)){sfx('pick');cburst(c,e.x*T+20,OY+e.y*T+20,14,[C.red,'#fff']);return false}return true});
      if(boss){
        const ph=boss.hp>4?0:boss.hp>2?1:2;boss.inv-=dt;boss.cd-=dt;boss.bb-=dt;
        if(boss.cd<=0){boss.cd=[.55,.42,.32][ph];const dx=pl.x-boss.x,dy=pl.y-boss.y;let ds=Math.abs(dx)>Math.abs(dy)?[dx>0?'r':'l',dy>0?'d':'u']:[dy>0?'d':'u',dx>0?'r':'l'];
          if(Math.random()<.35)ds=Object.keys(D).sort(()=>Math.random()-.5);
          for(const d of ds){if(tryMove(boss,d))break}}
        if(boss.bb<=0&&Math.abs(pl.x-boss.x)+Math.abs(pl.y-boss.y)<=5&&!has(boss.x,boss.y)){bombs.push({x:boss.x,y:boss.y,t:1.7,own:'b'});boss.bb=[4,3.2,2.4][ph]+rnd(0,1)}
        if(inFl(boss.x,boss.y,'p')&&boss.inv<=0){boss.hp--;bossHp=boss.hp;boss.inv=1.2;sfx('pick');cburst(c,boss.x*T+20,OY+boss.y*T+20,18,[C.gold,'#fff','#8a5ad0']);
          if(boss.hp===4)msg('Bóng Ma: Ta ít nói. Nhưng ta biết hết.',3000);if(boss.hp===2)msg('Bóng Ma: Đừng tưởng thắng được ta!',3000);if(boss.hp<=0){defeat();}}
      }
      if(inFl(pl.x,pl.y))hurt();
      if(en.some(e=>e.x===pl.x&&e.y===pl.y)||(boss&&end===0&&boss.x===pl.x&&boss.y===pl.y))hurt();
      if(goal&&goal.vis&&pl.x===goal.x&&pl.y===goal.y){sfx('open');confetti(70);L.win()}
    }
    const k=Math.min(1,dt*16);[pl,...en].forEach(o=>{o.px+=(o.x-o.px)*k;o.py+=(o.y-o.py)*k});if(boss){boss.px+=(boss.x-boss.px)*Math.min(1,dt*10);boss.py+=(boss.y-boss.py)*Math.min(1,dt*10)}
    /* vẽ */
    g.fillStyle=cfg.boss?'#150c34':'#241a5c';g.fillRect(0,0,360,400);
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){const X=x*T,Y=OY+y*T;
      g.fillStyle=cfg.boss?((x+y)%2?'#3a2b6a':'#33265f'):((x+y)%2?'#f0e0bd':'#e6d2a6');g.fillRect(X,Y,T,T);
      const v=map[y][x];
      if(v===1)outl(g,X+2,Y+2,1,[[0,0,34,34,'#8a7ac8'],[0,0,34,6,'#b3a6e8'],[4,12,26,4,'#7566b8'],[4,20,26,4,'#7566b8']]);
      else if(v===2)outl(g,X+2,Y+2,1,[[0,0,34,34,'#e08a4a'],[0,0,34,6,'#f2b06e'],[0,15,34,3,'#b8622c'],[15,0,3,15,'#b8622c'],[7,18,3,16,'#b8622c'],[24,18,3,16,'#b8622c']])}
    if(goal&&goal.vis&&!L.done){const X=goal.x*T,Y=OY+goal.y*T;heart(g,X+8,Y+11+Math.sin(t*6)*2,3.5,C.pink);sparkle(g,X+6,Y+8,4,'#fff');sparkle(g,X+34,Y+30,3,C.gold)}
    bombs.forEach(b=>{const X=b.x*T,Y=OY+b.y*T,warn=b.t<.7&&((t*14)|0)%2;bmpO(g,['....y...','...f....','..kkkk..','.kkkkkk.','.kwkkkk.','.kkkkkk.','.kkkkkk.','..kkkk..'],{k:warn?'#a8324a':b.own==='b'?'#5a2a80':'#3a3350',w:'#fff',f:'#c98a4a',y:((t*8)|0)%2?'#ffd25a':'#ff8a2b'},X+4,Y+4+(warn?0:Math.sin(t*8)*1),4)});
    flames.forEach(f=>{const X=f.x*T,Y=OY+f.y*T,a=Math.min(1,f.t*4);g.globalAlpha=a;g.fillStyle='#ff8a2b';g.fillRect(X+3,Y+3,34,34);g.fillStyle='#ffd25a';g.fillRect(X+8,Y+8,24,24);g.fillStyle='#fff';g.fillRect(X+15,Y+15,10,10);g.globalAlpha=1});
    en.forEach(e=>g.drawImage(bean,e.px*T+4,OY+e.py*T+4+Math.sin(t*6+e.x)*-2,32,32));
    if(boss&&end<3){const X=boss.px*T,Y=OY+boss.py*T,bl=boss.inv>0&&((t*16)|0)%2,mood=end>=2?'g':'r';
      if(!bl)ghostV(g,X+4,Y+6+Math.sin(t*4)*2,2,t,end>=2?C.mint:end===1&&((t*20)|0)%2?'#c8a8ff':'#8a5ad0',mood)}
    if(end<3&&(inv<=0||((t*16)|0)%2))EM(g,pl.px*T+6,OY+pl.py*T+T-40,2,pl.cd>.02?((t*10)|0)%2:0,inv>1?1:0);
    /* HUD */
    g.fillStyle='#120e26';g.fillRect(0,0,360,OY);
    if(boss&&!reveal){text(g,'BÓNG MA BÍ ẨN',10,13,22,'#c8a8ff');bar(g,10,26,190,8,boss.hp/BMAX,'#8a5ad0')}else if(!boss)text(g,'BOOM!  Phá thùng, tìm trái tim!',10,20,22,C.gold);
    for(let i=0;i<lives;i++)heart(g,304+i*18,10,2,C.pink);
    if(end>=3){g.fillStyle='rgba(6,3,20,.72)';g.fillRect(0,0,360,400);
      if(cfg.boss){const bob=Math.sin(t*3)*4;ghostV(g,240,50+bob,4,t,C.mint,'g');ANH(g,80,60+bob,10,((t*3)|0)%2,reveal>=2?0:2,reveal>=2?1:0);for(let i=0;i<6;i++)sparkle(g,60+i*48,40+Math.sin(t*5+i)*12,4,'#fff')}}
  });
}

<script>
'use strict';
function cburst(c,x,y,n,cols){const r=c.getBoundingClientRect(),gr=game.getBoundingClientRect();burst(r.left-gr.left+x*r.width/c.width,r.top-gr.top+y*r.height/c.height,n,cols)}
const dusk=['#241a5c','#33236f','#4a2c80','#6a3690','#93429a','#c2569a','#ee7a94'];
const night=['#0c0a24','#140f38','#1c1548','#261a5a'];
function ground(g,w,y,h,c1,c2){g.fillStyle=c1;g.fillRect(0,y,w,h);g.fillStyle=c2;for(let x=0;x<w;x+=12)g.fillRect(x,y,6,3)}
function text(g,s,x,y,size=26,col='#fff1d6',al='left',st=OL){g.font=size+'px VT323, monospace';g.textAlign=al;g.textBaseline='middle';g.lineWidth=5;g.strokeStyle=st;g.lineJoin='round';g.strokeText(s,x,y);g.fillStyle=col;g.fillText(s,x,y)}

/* ====== MÀN HÌNH TIÊU ĐỀ ====== */
function showTitle(){
  cleanup();cur=-1;setHud();msg('');Music.stop();$('#ttl').textContent='';$('#sub').textContent='';
  L=mkL();const {c,g,st}=L.canvas(360,480);const T={phase:'idle',t:0,go:false};
  const box=L.dom('','col');box.style.cssText='position:absolute;left:0;right:0;bottom:12px;align-items:center;z-index:6;padding:0 30px';
  const saved=+(store.get('anhem_lvl')||0);
  const b1=document.createElement('button');b1.className='btn big';b1.textContent=saved>0&&saved<TOTAL?'TIẾP TỤC (MÀN '+(saved+1)+')':'BẮT ĐẦU';box.appendChild(b1);
  if(saved>0&&saved<TOTAL){const b2=document.createElement('button');b2.className='btn sm pink';b2.textContent='CHƠI LẠI TỪ ĐẦU';box.appendChild(b2);b2.onclick=()=>{store.set('anhem_lvl','0');begin(0)}}
  b1.onclick=()=>begin(saved>0&&saved<TOTAL?saved:0);
  async function begin(n){

    if(n>0){Music.start('main');startLevel(n);return}
    Music.start('sneak');T.phase='steal';T.t=0;await sleep(2300);
    await intro();startLevel(0);
  }
  const hearts=[];for(let i=0;i<10;i++)hearts.push({x:rnd(20,340),y:rnd(0,480),s:rnd(14,30),p:rnd(0,6)});
  L.loop((dt,tm)=>{
    T.t+=dt;g.clearRect(0,0,360,480);
    skyBands(g,360,480,['#0c0a24','#130f36','#1b1448','#291a5e','#3f2378','#6a3391','#a0459b','#d95f96']);
    twinkle(g,360,480,tm,60,.55);moon(g,318,232);
    cloud(g,30+((tm*6)%420)-60,110,4,'#ffffff22');cloud(g,200-((tm*4)%420)+120,60,3,'#ffffff1a');
    skyline(g,360,340,['#1a1240','#ffd98a'],5);
    g.fillStyle='#2a1c66';g.fillRect(0,340,360,140);
    for(let y=344;y<480;y+=8){g.fillStyle=(y/8|0)%2?'#33227a':'#3a2886';const wv=Math.sin(tm*2+y)*6;for(let x=-10;x<370;x+=40)g.fillRect(x+wv,y,24,2)}
    g.fillStyle='#ffd98a30';for(let i=0;i<8;i++){g.fillRect(40+i*38+Math.sin(tm*2+i)*4,350+(i%3)*10,3,26)}
    g.fillStyle='#5b3d2a';g.fillRect(0,388,360,10);g.fillStyle='#7a5636';g.fillRect(0,388,360,3);
    hearts.forEach(h=>{h.y-=dt*h.s*.9;if(h.y<-20){h.y=490;h.x=rnd(20,340)}heart(g,h.x+Math.sin(tm*2+h.p)*8,h.y,2,'#ff6fa388')});
    const by=Math.sin(tm*2)*3|0;
    if(T.phase==='idle'){
      EM(g,150,318+by*0,4,(tm*2|0)%2,0);
      const ey=226+Math.sin(tm*2.2)*8;sparkle(g,150,ey-6,6,'#ffd25a');sparkle(g,214,ey+14,4,'#fff');sparkle(g,196,ey-14,3,'#ff9bc0');
      envelope(g,150,ey,4,false);
    }else{
      const p=Math.min(1,T.t/1.4);
      EM(g,150,318,4,0,1);
      const fxp=400-Math.min(1,T.t/.9)*230,ey=226+Math.sin(2.2)*8;
      if(T.t<.9){envelope(g,150,ey,4,false)}
      else{const q=(T.t-.9)/1.3;ghostV(g,fxp+q*300,ey-60-q*200,5,tm,'#8a5ad0','r');envelope(g,fxp+q*300-70,ey-q*200+8,4,false)}
      if(T.t<.9)ghostV(g,fxp,ey-60,5,tm,'#8a5ad0','r');
      g.fillStyle='rgba(6,3,20,'+(.55*Math.min(1,T.t/.8))+')';g.fillRect(0,0,360,480);
      if(T.t>.85&&T.t<.95){flash('#ff3b4e');shake();sfx('boom')}
    }
    /* tên game */
    const bob=Math.sin(tm*3)*2;
    text(g,'ANH & EM',180,62+bob,64,C.cam,'center');text(g,'QUEST',180,112+bob,56,C.pink,'center');
    text(g,'3 NĂM  •  25.10.2023 - 25.10.2026',180,158,22,'#cfc3ff','center');
    text(g,'DÀNH RIÊNG CHO EM',180,180,22,C.gold,'center');text(g,'Bật âm lượng, tắt chế độ im lặng để nghe nhạc',180,204,19,'#cfc3ff','center');
  });
}

run(L){
  const W=8,Hh=9,cs=42,ox=12,oy=14,cells=[];
  for(let i=0;i<W*Hh;i++)cells.push({n:1,e:1,s:1,w:1,v:0});
  const at=(x,y)=>cells[y*W+x],stk=[[0,0]];at(0,0).v=1;
  while(stk.length){const [x,y]=stk[stk.length-1],nb=[];
    if(y>0&&!at(x,y-1).v)nb.push([x,y-1,'n','s']);if(x<W-1&&!at(x+1,y).v)nb.push([x+1,y,'e','w']);
    if(y<Hh-1&&!at(x,y+1).v)nb.push([x,y+1,'s','n']);if(x>0&&!at(x-1,y).v)nb.push([x-1,y,'w','e']);

LV.push({name:'Bóng Ma Bí Ẩn',sub:'Đặt bom hạ Bóng Ma! Đừng đứng trong lửa, và né cả bom của nó.',hint:'Đặt bom rồi chạy ra xa 3 ô. Bóng Ma bị lửa chạm 6 lần là thua. Em có 3 mạng, hết mạng thì Bóng Ma hồi thêm chút máu.',mus:'boss',
mem:['Bóng ma là anh','Anh giấu thư mời để em đi lại từng chặng mình đã đi qua. Ba năm, chặng nào em cũng nhớ.'],
icon:g=>{ghostV(g,28,6,3,0,'#8a5ad0','g');heart(g,72,26,3)},
run(L){boom(L,{boss:true,dens:.2,defeat:[
  ['anh','...Bị phát hiện rồi.'],
  ['anh','Bóng ma này là anh đó. Anh giấu thư mời, để em đi lại từng chặng mình đã đi qua.','rev'],
  ['em','ANH?! Thư mời của em đâu?!'],
  ['anh','Ba năm rồi, mà chặng nào em cũng nhớ. Nghe anh nói nốt nhé.'],
  ['anh','Còn một màn cuối thôi. Màn này không có boss.','love']]})}});

/* ====== MÀN 18: MÀN CUỐI ====== */
LV.push({name:'Màn Cuối',sub:'Màn này không có boss. Chỉ có một câu hỏi.',hint:'Chọn CÓ nhé. Nút KHÔNG hơi... trơn.',mus:'love',
run(L){
  store.set('anhem_lvl','17');
  const {c,g,st}=L.canvas(360,300);let stage=0,ot=0,env=0,dodge=0;
  const wrap=L.dom('','col');wrap.style.cssText='align-items:center;text-align:center;gap:6px';
  const q=document.createElement('div');q.style.cssText='font-size:28px;line-height:1.1;padding:0 6px';q.textContent='Em có đồng ý đi ăn tối với anh vào ngày kỷ niệm '+CFG.date.slice(0,5)+' không?';wrap.appendChild(q);
  const zone=document.createElement('div');zone.style.cssText='position:relative;width:100%;height:96px';wrap.appendChild(zone);
  const yes=document.createElement('button'),no=document.createElement('button');
  yes.className='btn big mint';yes.textContent='CÓ!';yes.style.cssText='position:absolute;left:8%;top:22px';
  no.className='btn big';no.textContent='KHÔNG';no.style.cssText='position:absolute;right:8%;top:22px;background:#8a7aa8;box-shadow:0 4px 0 #4a3a68;transition:none';
  zone.append(yes,no);
  const runAway=e=>{if(e)e.preventDefault();dodge++;sfx('jump');const zr=zone.getBoundingClientRect(),yr=yes.getBoundingClientRect();no.style.right='auto';
    for(let k=0;k<14;k++){const nx=rnd(0,Math.max(10,zr.width-no.offsetWidth)),ny=rnd(0,Math.max(4,zr.height-no.offsetHeight));
      const ox=zr.left+nx,oy=zr.top+ny;const hit=ox<yr.right+14&&ox+no.offsetWidth>yr.left-14&&oy<yr.bottom+14&&oy+no.offsetHeight>yr.top-14;
      no.style.left=nx+'px';no.style.top=ny+'px';if(!hit)break}
    
    if(dodge===3)msg('Nút KHÔNG bị trơn quá, không bấm được.',3500);if(dodge===7)msg('Thôi bấm CÓ đi em.',3500)};
  no.addEventListener('pointerenter',runAway);no.addEventListener('pointerdown',runAway);
  yes.onclick=async()=>{
    if(stage)return;stage=1;sfx('open');wrap.remove();burst(game.clientWidth/2,game.clientHeight/2,60);
    await sleep(600);stage=2;sfx('open');await sleep(1600);
    await story(CFG.letter.map((t,i)=>({w:'anh',t,fn:i===0?()=>{shake();flash('#ffd25a')}:null})));
    stage=3;st.remove();
    const box=L.dom('','col');box.style.cssText='overflow:auto;align-items:center;justify-content:flex-start;padding:14px 10px;width:100%';
    box.innerHTML='<div class="paper"><div class="sm2">THƯ MỜI ĐẶC BIỆT</div><h3>Bữa Tối Kỷ Niệm 3 Năm</h3><p>Ngày <b>'+CFG.date+'</b>, dành riêng cho hai người</p><p class="sm2">Giờ và địa điểm sẽ được tiết lộ khi em nhắn mã này cho anh:</p><div class="code" id="cd"></div><button class="btn" id="cp">CHÉP MÃ</button><p class="sm2" style="margin-top:8px">hoặc chụp màn hình gửi anh cũng được</p></div>';
    confetti(140);Music.start('love');sfx('win');
    const cd=box.querySelector('#cd');
    for(let i=0;i<CFG.code.length;i++){await sleep(420);const s=document.createElement('span');s.textContent=CFG.code[i];cd.appendChild(s);sfx('pick')}
    await sleep(300);confetti(120);sfx('open');
    box.querySelector('#cp').onclick=()=>{
      sfx('tap');
      try{navigator.clipboard.writeText(CFG.code).then(()=>msg('Đã chép mã '+CFG.code+'!',4000)).catch(()=>msg('Chụp màn hình gửi anh nhé!',4000))}catch(e){msg('Chụp màn hình gửi anh nhé!',4000)}
    };
    const again=document.createElement('button');again.className='btn sm pink';again.textContent='CHƠI LẠI TỪ ĐẦU';again.style.marginTop='16px';again.onclick=()=>{store.set('anhem_lvl','0');showTitle()};box.appendChild(again);
  };
  L.loop((dt,t)=>{
    if(stage>=1&&stage<3){ot+=dt}
    skyBands(g,360,300,['#0c0a24','#170f40','#231657','#3a2172','#5a2c8a','#8a3f98']);twinkle(g,360,300,t,50,.8);moon(g,300,50);
    skyline(g,360,250,['#1c1248','#ffd98a'],11);
    g.fillStyle='#2a1c66';g.fillRect(0,250,360,50);g.fillStyle='#3a2886';for(let x=0;x<360;x+=20)g.fillRect(x+Math.sin(t*2+x)*3,254+(x/20%2)*10,12,2);
    if(stage===0){
      EM(g,118,168,4,0,0);ANH(g,190,168,4,0,0);
      heart(g,168,150+Math.sin(t*3)*4,4,C.pink);heart(g,140,120+Math.sin(t*2)*6,2,'#ff9bc0');heart(g,220,124+Math.cos(t*2)*6,2,'#ff9bc0');
    }else{
      const y=110+Math.sin(t*2.2)*8,o=stage>=2;
      for(let i=0;i<10;i++){sparkle(g,180+Math.cos(t*2+i)*(70+i*4),y+20+Math.sin(t*2+i)*(50+i*2),3+(i%3),i%2?'#fff':C.gold)}
      envelope(g,138,y,6,o);
      if(o){const lift=Math.min(1,ot/1.6);g.fillStyle='#fffdf2';g.fillRect(150,y+6-lift*40,84,44);g.fillStyle=OL;g.fillRect(150,y+6-lift*40,84,3);heart(g,180,y+16-lift*40,3,C.red)}
    }
  });
}});

/* ====== KHỞI ĐỘNG ====== */
['pointerdown','pointerup','touchend','click','keydown'].forEach(ev=>addEventListener(ev,()=>{if(AU.ctx&&AU.ctx.state==='running'&&AU.el&&!AU.el.paused)return;auUnlock()},{passive:true,capture:true}));setInterval(refreshMute,800);
setHud();
(function boot(){
  const go=()=>{const m=/^#L(\d+)$/.exec(location.hash);if(m){startLevel(clamp(+m[1]-1,0,TOTAL-1))}else showTitle()};
  const ready=(document.fonts&&document.fonts.load)?document.fonts.load('24px VT323').catch(()=>{}):Promise.resolve();
  Promise.race([ready,sleep(900)]).then(()=>setTimeout(go,30));
})();
</script>
